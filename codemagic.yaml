workflows:
  ios-capacitor-build:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      # Muss EXAKT der Name sein, den du dem API-Key in Codemagic gegeben hast
      # (Team settings > Integrations > Developer Portal > Manage keys)
      app_store_connect: FristenWaechter

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.echoreach.fristenwaechter
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install npm dependencies
        script: npm ci || npm install

      - name: Prepare static PWA for Capacitor (www)
        script: |
          rm -rf www && mkdir -p www
          cp index.html app.js styles.css sw.js manifest.json datenschutz.html impressum.html www/
          cp -R icons www/

      - name: Sync Capacitor iOS platform
        script: npx cap sync ios

      - name: Set up code signing settings
        script: xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
